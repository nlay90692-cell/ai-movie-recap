<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Movie Recap</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0a10;
  color: #eee;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 35px 18px;
}

.header {
  text-align: center;
  margin-bottom: 35px;
}

.logo {
  font-size: 48px;
}

h1 {
  margin: 8px 0;
  font-size: 34px;
  background: linear-gradient(90deg,#ff4fc3,#a56bff);
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  color: #aaa;
}

.card {
  background: #15141d;
  border: 1px solid #292735;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  min-height: 170px;
  resize: vertical;
  background: #0d0c13;
  color: white;
  border: 1px solid #302e3c;
  border-radius: 12px;
  padding: 15px;
  font-size: 15px;
  outline: none;
}

textarea:focus {
  border-color: #c05cff;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: linear-gradient(90deg,#ff43bd,#8d63ff);
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#results {
  margin-top: 22px;
}

.scene {
  background: #111019;
  border: 1px solid #2b2937;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
}

.scene h2 {
  margin-top: 0;
  color: #ff75d1;
  font-size: 20px;
}

.scene p {
  line-height: 1.6;
  color: #ddd;
}

.prompt {
  background: #09090d;
  border: 1px solid #302e3c;
  border-radius: 10px;
  padding: 13px;
  margin-top: 10px;
  white-space: pre-wrap;
  line-height: 1.5;
  color: #eee;
}

.copy {
  background: #292635;
  margin-top: 8px;
  padding: 10px;
  font-size: 13px;
}

.badge {
  display: inline-block;
  background: #272331;
  color: #ff8bd9;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 8px;
}

.footer {
  text-align: center;
  color: #555;
  font-size: 12px;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🎬</div>
    <h1>AI Movie Recap</h1>
    <div class="subtitle">
      Turn a movie story into a 4-scene AI video workflow.
    </div>
  </div>

  <div class="card">

    <label>Enter Movie Story</label>

    <textarea id="story"
      placeholder="Write your movie story here..."></textarea>

    <button onclick="generateScenes()">
      ✨ Generate 4-Scene Recap
    </button>

    <div id="results"></div>

  </div>

  <div class="footer">
    AI Movie Recap • Creative Video Workflow
  </div>

</div>


<script>

function splitStory(text) {

  let sentences = text
    .replace(/\n+/g, " ")
    .split(/[.!?]+/)
    .map(x => x.trim())
    .filter(x => x.length > 0);

  if (sentences.length === 0) {
    return [
      text,
      text,
      text,
      text
    ];
  }

  let parts = [];

  let size = Math.ceil(sentences.length / 4);

  for (let i = 0; i < 4; i++) {

    let start = i * size;

    let part = sentences
      .slice(start, start + size)
      .join(". ");

    if (!part) {
      part = sentences[sentences.length - 1];
    }

    parts.push(part + ".");
  }

  return parts;
}


function createImagePrompt(sceneText, sceneNumber) {

  return `
Cute cinematic 3D cartoon scene, high-quality animated movie style,
adorable expressive characters, detailed environment, soft cinematic lighting,
beautiful colors, emotional storytelling, depth of field.

Scene ${sceneNumber}:
${sceneText}

Vertical 9:16 composition, character clearly visible,
consistent character design, polished 3D animation,
no text, no watermark.
`;
}


function createVideoPrompt(sceneText, sceneNumber) {

  return `
Create a short cinematic 3D cartoon video.

Scene ${sceneNumber}:
${sceneText}

The characters move naturally with cute expressive facial animation.
Use gentle camera movement, subtle body motion and realistic environmental movement.
Keep the same character appearance throughout the shot.

Camera:
slow cinematic movement, smooth tracking shot,
soft depth of field.

Mood:
cute, emotional, warm and visually satisfying.

Duration:
5-8 seconds.

Vertical 9:16 video.
No subtitles.
No text.
No watermark.
`;
}


function createVoice(sceneText, sceneNumber) {

  return `
Scene ${sceneNumber} narration:

${sceneText}
`;
}


function copyText(text, button) {

  navigator.clipboard.writeText(text)
    .then(() => {

      let old = button.innerText;

      button.innerText = "✓ Copied!";

      setTimeout(() => {
        button.innerText = old;
      }, 1500);

    })
    .catch(() => {

      alert("Copy failed. Please copy manually.");

    });
}


function generateScenes() {

  const story =
    document.getElementById("story").value.trim();

  const results =
    document.getElementById("results");

  if (!story) {

    alert("Please enter a movie story first.");

    return;
  }

  const scenes = splitStory(story);

  const titles = [
    "🎬 Scene 1 — Introduction",
    "⚡ Scene 2 — Conflict",
    "🔥 Scene 3 — Climax",
    "💗 Scene 4 — Ending"
  ];

  results.innerHTML = "";

  scenes.forEach((sceneText, index) => {

    const number = index + 1;

    const imagePrompt =
      createImagePrompt(sceneText, number);

    const videoPrompt =
      createVideoPrompt(sceneText, number);

    const voice =
      createVoice(sceneText, number);

    const scene = document.createElement("div");

    scene.className = "scene";

    scene.innerHTML = `

      <span class="badge">
        Scene ${number}
      </span>

      <h2>${titles[index]}</h2>

      <p>
        <strong>Story:</strong><br>
        ${sceneText}
      </p>

      <h3>🎨 Image Prompt</h3>

      <div class="prompt">
        ${imagePrompt}
      </div>

      <button class="copy"
        onclick='copyText(${JSON.stringify(imagePrompt)}, this)'>
        📋 Copy Image Prompt
      </button>


      <h3>🎬 Video Prompt</h3>

      <div class="prompt">
        ${videoPrompt}
      </div>

      <button class="copy"
        onclick='copyText(${JSON.stringify(videoPrompt)}, this)'>
        📋 Copy Video Prompt
      </button>


      <h3>🎙️ Voice-over</h3>

      <div class="prompt">
        ${voice}
      </div>

      <button class="copy"
        onclick='copyText(${JSON.stringify(voice)}, this)'>
        📋 Copy Voice-over
      </button>

    `;

    results.appendChild(scene);

  });

  window.scrollTo({
    top: results.offsetTop - 20,
    behavior: "smooth"
  });

}

</script>

</body>
</html>
